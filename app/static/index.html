<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flou Player</title><link rel="stylesheet" href="/static/style.css?v=14"></head><body><div class="app">
<header><div class="transport"><button data-action="previous">◀</button><button data-action="play">▶</button><button data-action="pause">Ⅱ</button><button data-action="next">▶|</button><input id="volume" type="range" min="0" max="100" value="45"><span id="volumeLabel">45%</span></div><div class="lcd"><b id="playing">Flou Player</b><span id="playingSub">Local Music Control</span><span id="elapsed"></span></div></header>
<div class="toolbar"><button id="discover">Search devices</button><select id="server"><option>Select media server</option></select><select id="renderer"><option value="">Select output device</option><option value="__local__">This computer (local speakers)</option></select><button id="loadLibrary">Load library</button><input id="search" placeholder="Search music"><span id="breadcrumb" class="toolbar-status">Not loaded</span></div>
<div class="workspace"><main><section class="facets"><div><b>Album Artist</b><ul id="albumArtists"><li>All</li></ul></div><div><b>Artist</b><ul id="artists"><li>All</li></ul></div><div><b>Album</b><ul id="albumNames"><li>All</li></ul></div><div><b>Year</b><ul id="years"><li>All</li></ul></div></section><section class="albums"><div class="sectionhead"><b>Albums by Artist</b><div class="sectionhead-right"><span id="count"></span><div class="colpicker"><button id="colToggle" class="btn-link">Columns ▾</button><div id="colMenu" class="colmenu hidden"></div></div></div></div><div id="content"><div class="empty">Search for devices, then select a media server.</div></div></section></main><aside class="now"><h3>Now Playing</h3><div id="npCover" class="bigcover"></div><b id="npTitle">No track</b><span id="npArtist"></span><hr><div id="status">Not connected</div><details><summary>Diagnostics</summary><pre id="log"></pre></details></aside></div><audio id="localAudio" preload="none"></audio><div id="toast" class="toast hidden"></div><div id="metaModal" class="modal hidden"><div class="modal-content"><button id="metaClose" class="modal-close">×</button><h3 id="metaTitle">Metadata</h3><pre id="metaBody"></pre></div></div></div><script src="/static/app.js?v=14"></script></body></html>
