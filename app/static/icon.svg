<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a88d0"/>
      <stop offset="1" stop-color="#1f4f8a"/>
    </linearGradient>
    <!-- one Greek-key (meander) hook; the strip repeats it along a baseline -->
    <path id="key" d="M0 18 V0 H18 V12 H6 V6 H12" fill="none" stroke="#f2c14e" stroke-width="4" stroke-linejoin="miter" stroke-linecap="butt"/>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <!-- the F: stem plus two arms that end in meander hooks -->
  <g fill="none" stroke="#ffffff" stroke-width="15" stroke-linejoin="miter" stroke-linecap="butt">
    <path d="M84 56 V192"/>
    <path d="M76.500 63.500 H186 V98 H150 V80"/>
    <path d="M76.500 128 H160 V158 H128 V143"/>
  </g>
  <!-- meander border strip along the bottom -->
  <g transform="translate(34 208)" opacity=".95">
    <path d="M0 18 H188" fill="none" stroke="#f2c14e" stroke-width="4"/>
    <use href="#key" x="0"/><use href="#key" x="24"/><use href="#key" x="48"/><use href="#key" x="72"/>
    <use href="#key" x="96"/><use href="#key" x="120"/><use href="#key" x="144"/><use href="#key" x="168"/>
  </g>
</svg>
