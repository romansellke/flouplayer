name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        # Without --with-deps: the runner image already has Chromium's system libraries. The option would only
        # add font packages from the Ubuntu mirrors, and the whole job failed whenever those could not be reached.
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          playwright install chromium
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install the frontend tools
        run: npm ci
      - name: Python layout and lint
        run: |
          ruff format --check .
          ruff check .
      - name: JavaScript and CSS layout and lint
        run: |
          npm run format:check
          npm run lint
      - name: Run the tests
        run: pytest -q -rs
